<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>복층유리 치수 감시</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f5f8b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#e7ecee; --panel:#f8fafb; --ink:#1b272d; --muted:#5a6a72; --line:#c9d3d7;
  --ok:#11804c; --ng:#d2231b; --band:#e9a400; --accent:#1f5f8b;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#11181b; --panel:#1a2327; --ink:#e8eef0; --muted:#93a4ab; --line:#2c3a40; --ok:#2bc47a; --ng:#ff4a40; --band:#ffbf2e; --accent:#6fb2e0;}
}
:root[data-theme="dark"]{--bg:#11181b; --panel:#1a2327; --ink:#e8eef0; --muted:#93a4ab; --line:#2c3a40; --ok:#2bc47a; --ng:#ff4a40; --band:#ffbf2e; --accent:#6fb2e0;}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:14px;line-height:1.4}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.app{height:100%;display:flex;flex-direction:column;padding:6px 8px 8px;gap:6px;max-width:1200px;margin:0 auto}
.top{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.top h1{font-size:15px;margin:0;font-weight:700}
.state{margin-left:auto;font-weight:600;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.state.ok{color:var(--ok);border-color:var(--ok)}
.state.ng{color:#fff;background:var(--ng);border-color:var(--ng)}
.state.run{color:var(--accent);border-color:var(--accent)}
.icon{border:1px solid var(--line);background:var(--panel);border-radius:8px;min-width:40px;height:34px;font-size:13px;font-weight:600;padding:0 10px}

.stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:6px}
.cam{position:relative;flex:1 1 auto;min-height:30vh;background:#000;border-radius:10px;overflow:hidden}
.cam canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;touch-action:none;display:block}
.cam .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#d9e3e6;text-align:center;padding:16px}
.panel{flex:0 0 auto;display:flex;flex-direction:column;gap:6px}
.hint{margin:0;padding:6px 10px;border-left:4px solid var(--accent);background:var(--panel);border-radius:0 8px 8px 0;font-size:13px}
.hint.warn{border-color:var(--band)}

.readout{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.readout.ok{box-shadow:inset 0 0 0 3px var(--ok)}
.readout.ng{box-shadow:inset 0 0 0 3px var(--ng)}
.row1{display:flex;align-items:center;gap:10px}
.live small{display:block;font-size:12px;color:var(--muted)}
.big{display:flex;align-items:baseline;gap:6px}
.big b{font-size:clamp(44px,12vw,72px);line-height:1;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.big span{font-size:18px;color:var(--muted)}
.verdict{margin-left:auto;text-align:center;min-width:96px;padding:8px 10px;border-radius:10px;background:var(--bg);font-weight:700;font-size:18px;color:var(--muted)}
.verdict small{display:block;font-size:12px;font-weight:600}
.verdict.ok{background:var(--ok);color:#fff}
.verdict.ng{background:var(--ng);color:#fff}
.verdict.run{color:var(--accent)}
.gauge{position:relative;height:14px;margin:8px 0 2px;background:var(--bg);border-radius:4px;border:1px solid var(--line)}
.gauge .bandz{position:absolute;top:0;bottom:0;background:var(--band);opacity:.55}
.gauge .needle{position:absolute;top:-4px;bottom:-4px;width:4px;margin-left:-2px;background:var(--ink);border-radius:2px}
.gscale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.last{font-size:13px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.last b{color:var(--ink)} .last .ok{color:var(--ok);font-weight:700} .last .ng{color:var(--ng);font-weight:700} .last .na{color:var(--band);font-weight:700}

.strip{display:grid;grid-template-columns:1fr 1fr 1.6fr;gap:6px}
.strip label{display:flex;flex-direction:column;font-size:11px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.strip input{border:0;background:transparent;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;width:100%;padding:0}
.counts{display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel);border:1px solid var(--line);border-radius:8px}
.counts div{text-align:center;padding:4px 2px}
.counts small{display:block;color:var(--muted);font-size:11px}
.counts strong{font-size:18px;font-variant-numeric:tabular-nums}
.counts .c-ng strong{color:var(--ng)} .counts .c-ok strong{color:var(--ok)}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 4px;font-weight:600;font-size:13px;min-height:44px;line-height:1.2}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}

@media (orientation:landscape) and (min-width:700px){
  .stage{flex-direction:row}
  .cam{min-height:0}
  .panel{width:380px;overflow-y:auto}
}

.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--panel);width:100%;max-width:560px;max-height:88%;overflow-y:auto;border-radius:14px 14px 0 0;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-size:16px;margin:0 0 8px;display:flex;align-items:center}
.sheet h2 button{margin-left:auto}
.sheet h3{font-size:13px;margin:14px 0 6px;color:var(--muted)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.form input[type=number]{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:8px 10px;font-size:16px;font-variant-numeric:tabular-nums;width:100%}
.form input[type=range]{width:100%;accent-color:var(--accent)}
.form .full{grid-column:1/-1}
.form .chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px}
.form .chk input{width:20px;height:20px;accent-color:var(--accent)}
.note{font-size:12px;color:var(--muted);margin:4px 0 0}
#graph{width:100%;height:80px;display:block;background:var(--bg);border-radius:7px}
.log{list-style:none;margin:0;padding:0;max-height:220px;overflow:auto}
.log li{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;font-size:13px}
.log li time{color:var(--muted)}
.log li .k{margin-left:auto;font-weight:700}
.log .ok{color:var(--ok)} .log .ng{color:var(--ng)} .log .na{color:var(--band)}

.alarm{position:fixed;inset:0;z-index:50;background:var(--ng);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:24px;
  padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));animation:flash .5s steps(2) infinite}
@keyframes flash{50%{background:#7a0f0a}}
@media (prefers-reduced-motion:reduce){.alarm{animation:none}}
.alarm h2{margin:0;font-size:clamp(30px,8vw,54px)}
.alarm .v{font-size:clamp(64px,18vw,140px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.alarm p{margin:0;font-size:18px}
.alarm button{margin-top:16px;background:#fff;color:#7a0f0a;border:0;border-radius:12px;padding:18px 34px;font-size:20px;font-weight:700}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>복층유리 치수 감시</h1>
    <span id="state" class="state">카메라 꺼짐</span>
    <button id="setBtn" class="icon" aria-label="설정 열기">설정</button>
  </header>
  <div class="stage">
    <div class="cam">
      <canvas id="view" width="960" height="540" aria-label="카메라 화면"></canvas>
      <div id="empty" class="empty">
        <div>눈금자가 잘 보이도록 폰·패드를 고정한 뒤 시작하세요.</div>
        <button id="startBtn" class="btn primary" style="padding:12px 22px">카메라 시작</button>
        <div id="camErr" style="font-size:13px;max-width:420px"></div>
      </div>
    </div>
    <div class="panel">
      <p id="hint" class="hint">카메라를 시작하세요.</p>
      <div id="readout" class="readout">
        <div class="row1">
          <div class="live"><small>실시간 치수</small><div class="big"><b id="val">—</b><span>mm</span></div></div>
          <div id="verdict" class="verdict">대기</div>
        </div>
        <div class="gauge" aria-hidden="true"><div id="bandz" class="bandz"></div><div id="needle" class="needle" hidden></div></div>
        <div class="gscale"><span id="gmin"></span><span id="gmax"></span></div>
        <div class="last">최근 판정 <b id="lastVal">—</b> <span id="lastK"></span></div>
      </div>
      <div class="strip">
        <label>정상 치수<input id="f_target" type="number" step="0.5" inputmode="decimal"></label>
        <label>허용 ±<input id="f_tol" type="number" step="0.5" min="0" inputmode="decimal"></label>
        <div class="counts">
          <div><small>통과</small><strong id="cPass">0</strong></div>
          <div class="c-ok"><small>정상</small><strong id="cOk">0</strong></div>
          <div class="c-ng"><small>불량</small><strong id="cNg">0</strong></div>
        </div>
      </div>
      <div class="actions">
        <button id="pickBtn" class="btn" disabled>기준점<br>지정</button>
        <button id="bgBtn" class="btn" disabled>눈금자<br>기준 저장</button>
        <button id="testBtn" class="btn">알람<br>테스트</button>
        <button id="resetBtn" class="btn">카운트<br>초기화</button>
      </div>
    </div>
  </div>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="box" role="dialog" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">설정 <button id="closeBtn" class="icon">닫기</button></h2>
    <h3>눈금 기준점</h3>
    <div class="form">
      <label>A점 눈금값 (롤러쪽)<input id="f_aVal" type="number" step="1" inputmode="decimal"></label>
      <label>B점 눈금값 (위쪽)<input id="f_bVal" type="number" step="1" inputmode="decimal"></label>
    </div>
    <h3>알람</h3>
    <div class="form">
      <label class="chk full"><input id="f_hold" type="checkbox"> 불량 알람은 확인 버튼을 누를 때까지 계속 울림</label>
      <label class="chk full"><input id="f_okBeep" type="checkbox"> 정상일 때 짧은 확인음</label>
    </div>
    <h3>인식 조정</h3>
    <div class="form">
      <label class="full">눈금 일치 기준 (높을수록 엄격) <output id="o_match"></output><input id="f_match" type="range" min="0.2" max="0.9" step="0.05"></label>
      <label class="full">판정에 필요한 안정 프레임 <output id="o_stable"></output><input id="f_stable" type="range" min="3" max="20" step="1"></label>
      <label class="full">측정선 두께 (px) <output id="o_band"></output><input id="f_band" type="range" min="1" max="8" step="1"></label>
      <label class="full">유리 채움 비율 (%) <output id="o_cover"></output><input id="f_cover" type="range" min="20" max="90" step="5"></label>
      <div class="full"><canvas id="graph" width="600" height="80"></canvas></div>
    </div>
    <p class="note">그래프는 눈금자가 가려진 정도입니다(왼쪽이 A점). 유리가 없을 때는 전체가 노란 선 아래, 유리가 지나갈 때는 가려진 구간이 노란 선 위로 올라오도록 기준을 맞추세요.</p>
    <h3>측정 기록</h3>
    <ul id="log" class="log"><li style="color:var(--muted)">아직 기록이 없습니다.</li></ul>
  </div>
</div>

<div id="alarm" class="alarm" hidden role="alertdialog" aria-labelledby="alarmTitle">
  <h2 id="alarmTitle">치수 불량</h2>
  <div class="v" id="alarmVal">—</div>
  <p id="alarmRef"></p>
  <button id="ackBtn">확인 · 알람 정지</button>
</div>
<script>
(function(){
const $=s=>document.querySelector(s);
const view=$('#view'), ctx=view.getContext('2d',{willReadFrequently:true});
const gctx=$('#graph').getContext('2d');
const video=document.createElement('video');
video.muted=true; video.playsInline=true; video.setAttribute('playsinline','');

const KEY='glassgauge.v1';
const DEF={ax:.08,ay:.5,bx:.92,by:.5,lineSet:false,aVal:0,bVal:100,target:46,tol:2,match:.5,stable:6,band:3,cover:45,hold:true,okBeep:true};
let S=Object.assign({},DEF);
try{const j=localStorage.getItem(KEY); if(j) Object.assign(S,JSON.parse(j));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

let running=false, mode='run', bg=null, lastProfile=null, lastA=null;
let state='idle', buf=[], absent=0, liveMm=null, decided=null, hadValues=false;
const counts={pass:0,ok:0,ng:0}; const log=[];
let W=view.width, H=view.height;

/* ---------- settings binding ---------- */
['target','tol','aVal','bVal','match','stable','band','cover'].forEach(k=>{
  const el=$('#f_'+k); el.value=S[k];
  el.addEventListener('input',()=>{
    const v=parseFloat(el.value); if(isNaN(v)) return;
    S[k]=(k==='stable'||k==='band')?Math.round(v):v;
    if(k==='band'){bg=null;}
    save(); refreshStatic();
  });
});
['hold','okBeep'].forEach(k=>{const el=$('#f_'+k); el.checked=!!S[k]; el.addEventListener('change',()=>{S[k]=el.checked;save();});});

/* ---------- audio / alarm ---------- */
let actx=null;
function unlockAudio(){try{if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume();}catch(e){}}
function tone(f,dur,vol,type){
  if(!actx) return; const t=actx.currentTime, o=actx.createOscillator(), g=actx.createGain();
  o.type=type||'square'; o.frequency.value=f;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01);
  g.gain.setValueAtTime(vol,t+dur-.02); g.gain.linearRampToValueAtTime(0,t+dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur+.03);
}
function vib(p){try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}
let alarmTimer=null, alarmStop=null, flip=false;
function startAlarm(mm){
  $('#alarmVal').textContent=fmt(mm)+' mm';
  $('#alarmRef').textContent='정상 '+fmt(S.target)+' ± '+fmt(S.tol)+' mm  ·  차이 '+(mm-S.target>0?'+':'')+fmt(mm-S.target)+' mm';
  $('#alarm').hidden=false; unlockAudio();
  if(alarmTimer) return;
  alarmTimer=setInterval(()=>{flip=!flip; tone(flip?1180:760,.22,.75); vib(200);},260);
  clearTimeout(alarmStop); if(!S.hold) alarmStop=setTimeout(stopAlarm,4000);
}
function stopAlarm(){clearInterval(alarmTimer); alarmTimer=null; clearTimeout(alarmStop); vib(0); $('#alarm').hidden=true;}
$('#ackBtn').addEventListener('click',stopAlarm);
$('#testBtn').addEventListener('click',()=>{unlockAudio(); startAlarm(S.target+7);});

/* ---------- wake lock ---------- */
let wake=null;
async function keepAwake(){try{if('wakeLock' in navigator) wake=await navigator.wakeLock.request('screen');}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&running) keepAwake();});

/* ---------- camera ---------- */
$('#startBtn').addEventListener('click',async()=>{
  unlockAudio();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    $('#camErr').textContent='이 브라우저에서는 카메라를 쓸 수 없습니다. 크롬(안드로이드) 또는 사파리(아이폰·아이패드)로 여세요.'; return;
  }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});
    video.srcObject=stream; await video.play();
    const vw=video.videoWidth||1280, vh=video.videoHeight||720, sc=Math.min(1,960/Math.max(vw,vh));
    view.width=W=Math.round(vw*sc); view.height=H=Math.round(vh*sc);
    
    $('#empty').hidden=true; $('#pickBtn').disabled=false; $('#bgBtn').disabled=!S.lineSet;
    running=true; keepAwake(); requestAnimationFrame(loop);
  }catch(e){
    $('#camErr').textContent='카메라 권한이 거부되었거나 사용할 수 없습니다. 브라우저 설정에서 카메라를 허용한 뒤 다시 시도하세요. ('+(e.name||e)+')';
  }
});

/* ---------- picking reference points ---------- */
$('#pickBtn').addEventListener('click',()=>{mode='pickA'; bg=null; setState('setup');});
view.addEventListener('pointerdown',e=>{
  if(mode!=='pickA'&&mode!=='pickB') return;
  const r=view.getBoundingClientRect(), sc=Math.min(r.width/W,r.height/H), cw=W*sc, ch=H*sc;
  const x=(e.clientX-r.left-(r.width-cw)/2)/cw, y=(e.clientY-r.top-(r.height-ch)/2)/ch;
  if(x<0||x>1||y<0||y>1) return;
  if(mode==='pickA'){S.ax=x;S.ay=y;mode='pickB';}
  else{S.bx=x;S.by=y;mode='run';S.lineSet=true;$('#bgBtn').disabled=false;}
  save();
});
$('#bgBtn').addEventListener('click',()=>{
  if(lastProfile){bg=Float32Array.from(lastProfile); state='ready'; buf=[]; absent=99;}
});
$('#resetBtn').addEventListener('click',()=>{counts.pass=counts.ok=counts.ng=0; log.length=0; renderCounts(); renderLog();});

/* ---------- geometry ---------- */
function pts(){return {A:{x:S.ax*W,y:S.ay*H},B:{x:S.bx*W,y:S.by*H}};}
function lineOk(){const {A,B}=pts(); return S.lineSet && Math.hypot(B.x-A.x,B.y-A.y)>=40 && S.bVal!==S.aVal;}
function idxToMm(i,N){return S.aVal+(i/(N-1))*(S.bVal-S.aVal);}
function mmToPt(mm){const {A,B}=pts(); const t=(mm-S.aVal)/(S.bVal-S.aVal); return {x:A.x+(B.x-A.x)*t,y:A.y+(B.y-A.y)*t};}
function mmPerPx(){const {A,B}=pts(); return Math.abs(S.bVal-S.aVal)/Math.max(1,Math.hypot(B.x-A.x,B.y-A.y));}

function sample(){
  const {A,B}=pts(); const dx=B.x-A.x, dy=B.y-A.y, L=Math.hypot(dx,dy), N=Math.max(2,Math.round(L));
  const px=-dy/L, py=dx/L, bd=S.band;
  const x0=Math.max(0,Math.floor(Math.min(A.x,B.x)-bd-2)), y0=Math.max(0,Math.floor(Math.min(A.y,B.y)-bd-2));
  const x1=Math.min(W,Math.ceil(Math.max(A.x,B.x)+bd+2)), y1=Math.min(H,Math.ceil(Math.max(A.y,B.y)+bd+2));
  const w=x1-x0, h=y1-y0; if(w<1||h<1) return null;
  const d=ctx.getImageData(x0,y0,w,h).data, out=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const t=i/(N-1), cx=A.x+dx*t, cy=A.y+dy*t; let r=0,g=0,b=0,c=0;
    for(let k=-bd;k<=bd;k++){
      const x=Math.round(cx+px*k)-x0, y=Math.round(cy+py*k)-y0;
      if(x<0||y<0||x>=w||y>=h) continue; const o=(y*w+x)*4; r+=d[o]; g+=d[o+1]; b+=d[o+2]; c++;
    }
    if(c){out[i*3]=r/c; out[i*3+1]=g/c; out[i*3+2]=b/c;}
  }
  return out;
}
function analyze(p){
  // 눈금자 가림 방식: 저장해 둔 "다 보이는 눈금자"와 지금 화면을 구간별로 비교한다.
  // 눈금 무늬(촘촘한 mm 눈금)가 그대로 보이면 일치, 유리에 가려지면(블랙=어두움, 미러=반사) 무늬가 사라져 불일치.
  // 밝기 변화에는 둔감한 정규화 상관(NCC)을 쓴다.
  const N=p.length/3, g=new Float32Array(N), r=new Float32Array(N);
  for(let i=0;i<N;i++){const j=i*3; g[i]=(p[j]+p[j+1]+p[j+2])/3; r[i]=(bg[j]+bg[j+1]+bg[j+2])/3;}
  const mk=()=>new Float64Array(N+1), Sg=mk(),Sr=mk(),Sgg=mk(),Srr=mk(),Sgr=mk();
  for(let i=0;i<N;i++){Sg[i+1]=Sg[i]+g[i]; Sr[i+1]=Sr[i]+r[i]; Sgg[i+1]=Sgg[i]+g[i]*g[i]; Srr[i+1]=Srr[i]+r[i]*r[i]; Sgr[i+1]=Sgr[i]+g[i]*r[i];}
  const h=Math.max(6,Math.round(N/60)), s=new Float32Array(N);
  for(let i=0;i<N;i++){
    const a=Math.max(0,i-h), b=Math.min(N,i+h+1), n=b-a;
    const mg=(Sg[b]-Sg[a])/n, mr=(Sr[b]-Sr[a])/n;
    const vg=Math.max(0,(Sgg[b]-Sgg[a])/n-mg*mg), vr=Math.max(0,(Srr[b]-Srr[a])/n-mr*mr), c=(Sgr[b]-Sgr[a])/n-mg*mr;
    let score;
    if(vr<9) score=Math.abs(mg-mr)<25?1:0;                       // 무늬 없는 구간은 밝기로만 판단
    else score=(c/Math.sqrt(Math.max(1e-6,vg*vr)))*Math.min(1,Math.sqrt(vg/vr)/0.6);
    s[i]=1-Math.max(0,Math.min(1,score));                         // 0=눈금 보임, 1=가려짐
  }
  // 유리는 롤러쪽(A점)부터 덮으므로 A부터 '가려짐'이 충분히 이어진 구간의 끝 = 유리 윗변
  const thr=1-S.match;
  let edge=-1, run=0, cnt=0, head=0; const headN=Math.max(5,Math.round(N*.08));
  for(let i=0;i<N;i++){
    if(s[i]>thr){cnt++; run++; if(i<headN) head++;} else run=0;
    if(run>=3 && cnt/(i+1)>=S.cover/100) edge=i;
  }
  const present=edge>=Math.max(4,N*.03) && head>=headN*.4;
  return {s,N,edge,present};
}

/* ---------- state machine ---------- */
function median(a){const b=[...a].sort((x,y)=>x-y), m=b.length>>1; return b.length%2?b[m]:(b[m-1]+b[m])/2;}
function process(a,p){
  if(a.present){
    absent=0;
    if(state==='ready'){state='measuring'; buf=[]; decided=null; hadValues=false;}
    liveMm=idxToMm(a.edge,a.N);
    if(state==='measuring'){
      hadValues=true; buf.push(liveMm); if(buf.length>S.stable) buf.shift();
      if(buf.length>=S.stable){
        const span=Math.max(...buf)-Math.min(...buf);
        if(span<=Math.max(1.5,mmPerPx()*3)) decide(median(buf));
      }
    }
  }else{
    absent++;
    if(absent>8 && (state==='measuring'||state==='decided')){
      if(state==='measuring'&&hadValues){addLog(null,'na'); tone(520,.12,.5); setTimeout(()=>tone(520,.12,.5),180);}
      state='ready'; buf=[]; liveMm=null;
    }
    if(absent>15 && state==='ready'){for(let i=0;i<bg.length;i++) bg[i]+=(p[i]-bg[i])*.02;}
  }
}
function decide(mm){
  state='decided'; decided=mm; counts.pass++;
  const ok=Math.abs(mm-S.target)<=S.tol;
  if(ok){counts.ok++; addLog(mm,'ok'); if(S.okBeep) tone(1500,.09,.35,'sine');}
  else{counts.ng++; addLog(mm,'ng'); startAlarm(mm);}
  renderCounts();
}

/* ---------- rendering ---------- */
function fmt(n){return (Math.round(n*10)/10).toFixed(1);}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function drawOverlay(a){
  const lw=Math.max(2,W/360);
  if(mode==='pickA'||mode==='pickB'){
    ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(0,0,W,H);
    if(mode==='pickB'){const {A}=pts(); dot(A,'#ffbf2e','A');}
    return;
  }
  if(!S.lineSet) return;
  const {A,B}=pts();
  ctx.lineCap='round';
  ctx.strokeStyle='rgba(111,178,224,.9)'; ctx.lineWidth=lw; ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(B.x,B.y); ctx.stroke();
  if(lineOk()){
    const p1=mmToPt(S.target-S.tol), p2=mmToPt(S.target+S.tol);
    ctx.strokeStyle='rgba(255,191,46,.75)'; ctx.lineWidth=lw*5; ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke();
  }
  dot(A,'#6fb2e0','A '+S.aVal); dot(B,'#6fb2e0','B '+S.bVal);
  if(a&&a.present){
    const e=mmToPt(idxToMm(a.edge,a.N)), ok=Math.abs(idxToMm(a.edge,a.N)-S.target)<=S.tol;
    const L=Math.hypot(B.x-A.x,B.y-A.y), nx=-(B.y-A.y)/L, ny=(B.x-A.x)/L, len=H*.12;
    ctx.strokeStyle=ok?'#2bc47a':'#ff4a40'; ctx.lineWidth=lw*1.6;
    ctx.beginPath(); ctx.moveTo(e.x-nx*len,e.y-ny*len); ctx.lineTo(e.x+nx*len,e.y+ny*len); ctx.stroke();
    const txt=fmt(idxToMm(a.edge,a.N)), fs=Math.round(Math.max(W,H)/16);
    ctx.font='700 '+fs+'px system-ui,sans-serif'; const tw=ctx.measureText(txt).width;
    let tx=e.x+nx*len+8, ty=e.y+ny*len; tx=Math.max(4,Math.min(W-tw-12,tx)); ty=Math.max(fs,Math.min(H-8,ty));
    ctx.fillStyle='rgba(0,0,0,.65)'; ctx.fillRect(tx-6,ty-fs,tw+12,fs*1.2);
    ctx.fillStyle=ok?'#2bc47a':'#ff4a40'; ctx.fillText(txt,tx,ty-fs*.05);
  }
}
function dot(p,c,label){
  const r=Math.max(6,W/110); ctx.fillStyle=c; ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2); ctx.fill();
  ctx.font='600 '+Math.round(W/38)+'px system-ui,sans-serif'; ctx.lineWidth=4; ctx.strokeStyle='rgba(0,0,0,.7)';
  ctx.strokeText(label,p.x+r+4,p.y-r-4); ctx.fillStyle='#fff'; ctx.fillText(label,p.x+r+4,p.y-r-4);
}
function drawGraph(a){
  const g=gctx, w=600, h=90; g.clearRect(0,0,w,h);
  if(!a) return;
  const max=1.05; g.strokeStyle=css('--accent'); g.lineWidth=1.5; g.beginPath();
  for(let i=0;i<a.N;i++){const x=i/(a.N-1)*w, y=h-Math.min(1,a.s[i]/max)*h; i?g.lineTo(x,y):g.moveTo(x,y);} g.stroke();
  const ty=h-(1-S.match)/max*h; g.strokeStyle=css('--band'); g.setLineDash([5,4]); g.beginPath(); g.moveTo(0,ty); g.lineTo(w,ty); g.stroke(); g.setLineDash([]);
  if(a.present){const x=a.edge/(a.N-1)*w; g.strokeStyle=css('--ng'); g.beginPath(); g.moveTo(x,0); g.lineTo(x,h); g.stroke();}
}
function setState(s){state=s;}
let lastStateText='';
function renderStatus(){
  let t='카메라 꺼짐', cls='', hint='카메라를 시작하세요.', warn=false;
  if(running){
    if(mode==='pickA'){t='기준점 지정'; hint='A점: 눈금자 위, 눈금선이 촘촘한 가장자리를 따라 아래쪽 끝(롤러쪽)을 터치하세요. 그 지점의 눈금값을 A점 값으로 입력합니다.'; warn=true;}
    else if(mode==='pickB'){t='기준점 지정'; hint='B점: 같은 눈금자 가장자리를 따라 위로, 가장 큰 유리의 윗변보다 더 위쪽을 터치하세요. 그 지점의 눈금값을 B점 값으로 입력합니다.'; warn=true;}
    else if(!S.lineSet){t='설정 필요'; hint='"기준점 지정"을 눌러 측정선을 만드세요.'; warn=true;}
    else if(!lineOk()){t='설정 확인'; hint='A·B 눈금값이 같거나 두 점이 너무 가깝습니다.'; warn=true;}
    else if(!bg){t='배경 필요'; hint='유리가 없어 눈금자가 다 보이는 상태에서 "눈금자 기준 저장"을 누르세요. A·B 눈금값도 확인하세요.'; warn=true;}
    else if(state==='measuring'){t='측정 중'; cls='run'; hint='유리 인식 중… 값이 안정되면 판정합니다.';}
    else if(state==='decided'){const ok=Math.abs(decided-S.target)<=S.tol; t=ok?'정상':'불량'; cls=ok?'ok':'ng'; hint=ok?'정상 판정. 유리가 지나가면 다음 유리를 기다립니다.':'불량 판정! 라인을 확인하세요.';}
    else {t='대기 중'; hint='유리 진입을 기다리는 중입니다. 눈금 정확도는 mm당 약 '+fmt(1/mmPerPx())+'px ('+fmt(mmPerPx())+' mm/px).';}
  }
  const key=t+cls+hint;
  if(key!==lastStateText){
    lastStateText=key;
    const st=$('#state'); st.textContent=t; st.className='state '+cls;
    const h=$('#hint'); h.textContent=hint; h.className='hint'+(warn?' warn':'');
  }
  const shown=liveMm;
  $('#val').textContent=shown==null?'—':fmt(shown);
  const v=$('#verdict'), ro=$('#readout');
  if(state==='decided'){
    const ok=Math.abs(decided-S.target)<=S.tol, d=decided-S.target;
    v.innerHTML=(ok?'정상':'불량')+'<small>'+(d>0?'+':'')+fmt(d)+' mm</small>'; v.className='verdict '+(ok?'ok':'ng'); ro.className='readout '+(ok?'ok':'ng');
  }else if(state==='measuring'){v.innerHTML='측정 중'; v.className='verdict run'; ro.className='readout';}
  else{v.innerHTML='대기'; v.className='verdict'; ro.className='readout';}
  const lo=S.target-Math.max(S.tol*4,8), hi=S.target+Math.max(S.tol*4,8), nd=$('#needle');
  if(shown==null) nd.hidden=true; else {nd.hidden=false; nd.style.left=Math.max(0,Math.min(100,(shown-lo)/(hi-lo)*100))+'%';}
}
function refreshStatic(){
  const lo=S.target-Math.max(S.tol*4,8), hi=S.target+Math.max(S.tol*4,8);
  const bz=$('#bandz'); bz.style.left=((S.target-S.tol-lo)/(hi-lo)*100)+'%'; bz.style.width=(2*S.tol/(hi-lo)*100)+'%';
  $('#gmin').textContent=fmt(lo); $('#gmax').textContent=fmt(hi);
  if($('#ref')) $('#ref').textContent='정상 '+fmt(S.target)+' mm, 허용 '+fmt(S.target-S.tol)+' ~ '+fmt(S.target+S.tol)+' mm';
  $('#o_match').textContent=' '+S.match; $('#o_stable').textContent=' '+S.stable; $('#o_band').textContent=' '+S.band; $('#o_cover').textContent=' '+S.cover;
}
function renderCounts(){$('#cPass').textContent=counts.pass; $('#cOk').textContent=counts.ok; $('#cNg').textContent=counts.ng;}
function addLog(mm,k){log.unshift({t:new Date(),mm,k}); if(log.length>200) log.pop(); renderLog();
  $('#lastVal').textContent=mm==null?'—':fmt(mm)+' mm'; const lk=$('#lastK'); lk.textContent=k==='ok'?'정상':k==='ng'?'불량':'미판정'; lk.className=k;}
function renderLog(){
  const ul=$('#log');
  if(!log.length){ul.innerHTML='<li style="color:var(--muted)">아직 기록이 없습니다.</li>'; return;}
  ul.innerHTML=log.slice(0,100).map(r=>{
    const tm=r.t.toTimeString().slice(0,8), lab=r.k==='ok'?'정상':r.k==='ng'?'불량':'미판정';
    return '<li><time>'+tm+'</time><span>'+(r.mm==null?'—':fmt(r.mm)+' mm')+'</span><span class="k '+r.k+'">'+lab+'</span></li>';
  }).join('');
}

/* ---------- main loop ---------- */
function loop(){
  if(!running) return;
  if(video.readyState>=2) ctx.drawImage(video,0,0,W,H);
  let a=null;
  if(mode==='run'&&lineOk()){
    const p=sample();
    if(p){
      if(bg&&bg.length!==p.length) bg=null;
      lastProfile=p;
      if(bg){a=analyze(p); process(a,p);}
    }
  }
  drawOverlay(a); drawGraph(a); renderStatus();
  requestAnimationFrame(loop);
}
$('#setBtn').addEventListener('click',()=>{$('#sheet').hidden=false;});
$('#closeBtn').addEventListener('click',()=>{$('#sheet').hidden=true;});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet') $('#sheet').hidden=true;});
refreshStatic(); renderCounts(); renderStatus();
})();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
